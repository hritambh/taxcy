# Flutter gen-l10n: English is the template; every other app_<lang>.arb is a translation.
# The generated Dart (lib/l10n/app_localizations*.dart) is committed, like the drift code,
# and regenerated by `flutter pub get` / `flutter gen-l10n`.
arb-dir: lib/l10n
output-dir: lib/l10n
template-arb-file: app_en.arb
output-localization-file: app_localizations.dart
output-class: AppLocalizations
preferred-supported-locales: [en]
nullable-getter: false
use-named-parameters: true
format: true
