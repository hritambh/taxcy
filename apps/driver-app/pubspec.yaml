publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.4

dependencies:
  camera: ^0.12.0+2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.7
  drift: ^2.28.0
  drift_flutter: any
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
