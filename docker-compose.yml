name: taxcy

services:
  postgres:
    # Multi-arch PostGIS build; the official postgis/postgis image is amd64-only.
    image: imresamu/postgis:16-3.5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-taxcy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-taxcy}
      POSTGRES_DB: ${POSTGRES_DB:-taxcy}
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-roles.sql:/docker-entrypoint-initdb.d/10-init-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:8-alpine
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 3s
      retries: 30

  s3:
    # RustFS: S3-compatible object storage (MinIO no longer publishes images).
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY_ID:-taxcy}
      RUSTFS_SECRET_KEY: ${S3_SECRET_ACCESS_KEY:-taxcy-dev-secret}
      RUSTFS_CONSOLE_ENABLE: 'true'
    ports:
      - '${S3_PORT:-9000}:9000'
      - '${S3_CONSOLE_PORT:-9001}:9001'
    volumes:
      - s3-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:9000/health || exit 1']
      interval: 2s
      timeout: 3s
      retries: 30

  s3-init:
    image: amazon/aws-cli:2.31.13
    depends_on:
      s3:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-taxcy}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-taxcy-dev-secret}
      AWS_DEFAULT_REGION: ${S3_REGION:-ap-south-1}
      BUCKET: ${S3_BUCKET:-taxcy-media}
    volumes:
      # Browser uploads (admin web, driver app in Chrome) PUT straight to presigned URLs,
      # so the bucket must allow those origins.
      - ./infra/s3:/s3:ro
    entrypoint: ['sh', '-c']
    command:
      - (aws --endpoint-url http://s3:9000 s3api head-bucket --bucket "$$BUCKET" 2>/dev/null
        || aws --endpoint-url http://s3:9000 s3 mb "s3://$$BUCKET")
        && aws --endpoint-url http://s3:9000 s3api put-bucket-cors --bucket "$$BUCKET"
        --cors-configuration file:///s3/cors.json
    restart: 'no'

volumes:
  postgres-data:
  redis-data:
  s3-data:
